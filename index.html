<title>Yukimalのホームページ</title>
<div style="text-align: center;">
  <h1>Yukimalのホームページ(仮)</h1>
  <img src="/media/image/YukimalIcon.png" alt="YukimalIcon">
  <h2 style="text-align: center;">NEWS</h2>
<style>
  /* ニュースエリア全体の枠組み設定 */
  .simple-news-box {
    width: 100%;
    max-width: 700px;
    margin: 40px auto;
    padding: 15px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    background-color: #fff;
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
  }

  /* 縦に伸びないためのスクロール設定 */
  .simple-news-scroll {
    max-height: 200px;
    overflow-y: auto;
    padding-right: 5px;
  }

  /* 各ニュースの1行設定（リンク） */
  .simple-news-item {
    display: flex;
    align-items: center;
    padding: 10px 5px;
    border-bottom: 1px solid #eee;
    text-decoration: none;
    color: #333;
    font-size: 0.9rem;
    gap: 15px;
    transition: background-color 0.2s;
  }

  .simple-news-item:last-child {
    border-bottom: none;
  }

  .simple-news-item:hover {
    background-color: #f5f5f5;
  }

  /* 日端のスタイル */
  .simple-news-date {
    color: #666;
    white-space: nowrap;
  }

  /* ラベルのスタイル（共通ベース） */
  .simple-news-label {
    color: #fff;
    font-size: 0.75rem;
    font-weight: bold;
    padding: 3px 8px;
    border-radius: 4px;
    white-space: nowrap;
    background-color: #718096;
    transition: transform 0.6s ease; /* スピン演出用 */
  }

  /* ===================================================
     🎨 カラー＆特殊演出設定
     =================================================== */
  /* 基本・拡張カラー */
  .simple-news-label.red        { background-color: #ff0000; }
  .simple-news-label.blue       { background-color: #007bff; }
  .simple-news-label.green      { background-color: #28a745; }
  .simple-news-label.orange     { background-color: #fd7e14; }
  .simple-news-label.purple     { background-color: #6f42c1; }
  .simple-news-label.pink       { background-color: #e83e8c; }
  .simple-news-label.cyan       { background-color: #17a2b8; }
  .simple-news-label.black      { background-color: #343a40; }
  .simple-news-label.yellow     { background-color: #ffc107; color: #333 !important; }
  .simple-news-label.brown      { background-color: #8b4513; }
  .simple-news-label.gray       { background-color: #6c757d; }
  .simple-news-label.gold       { background-color: #d4af37; }
  .simple-news-label.lime       { background-color: #20c997; }
  .simple-news-label.wine       { background-color: #800020; }
  .simple-news-label.navy       { background-color: #000080; }

  /* ゲーミング（虹色変化） */
  .simple-news-label.gaming {
    background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff);
    background-size: 1400% 1400%;
    animation: gamingAnimation 3s linear infinite;
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
  }
  @keyframes gamingAnimation {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* フラッシュ（点滅） */
  .simple-news-label.flash {
    background-color: #ff0000;
    animation: flashAnimation 0.5s ease infinite alternate;
  }
  @keyframes flashAnimation { 0% { opacity: 1; } 100% { opacity: 0.3; } }

  /* ゴースト（幽霊風） */
  .simple-news-label.ghost {
    background-color: #4a0e4e; color: #9b59b6;
    animation: ghostAnimation 3s ease-in-out infinite;
  }
  @keyframes ghostAnimation { 0%,100% { opacity:0.2; transform:scale(0.95); } 50% { opacity:1; transform:scale(1); } }

  /* ラグジュアリーゴールド（メタリック金） */
  .simple-news-label.luxury-gold {
    background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
    color: #333 !important; font-weight: 900; box-shadow: 0 0 5px rgba(186,149,63,0.6);
  }

  /* ネオン（サイバー発光） */
  .simple-news-label.neon {
    background-color: #000; color: #00ffcc !important; border: 1px solid #00ffcc;
    box-shadow: 0 0 8px #00ffcc, inset 0 0 4px #00ffcc;
  }

  /* スピン（ホバー時に回転） */
  .simple-news-item:hover .simple-news-label.spin { transform: rotateY(360deg); }
  .simple-news-label.spin { background-color: #e67e22; }
  
  /* 🫨 1. 文字が小刻みにグラグラ揺れる（地震・パニック風） */
  .simple-news-item:hover .text-shake {
    display: inline-block;
    animation: shakeAnimation 0.1s linear infinite;
  }
  @keyframes shakeAnimation {
    0% { transform: translate(1px, 1px) rotate(0deg); }
    10% { transform: translate(-1px, -1px) rotate(-1deg); }
    20% { transform: translate(-2px, 0px) rotate(1deg); }
    30% { transform: translate(1px, 2px) rotate(0deg); }
    40% { transform: translate(1px, -1px) rotate(1deg); }
    50% { transform: translate(-1px, 1px) rotate(-1deg); }
    60% { transform: translate(-2px, 1px) rotate(0deg); }
    70% { transform: translate(2px, 1px) rotate(-1deg); }
    80% { transform: translate(-1px, -1px) rotate(1deg); }
    90% { transform: translate(1px, 1px) rotate(0deg); }
    100% { transform: translate(1px, -1px) rotate(-1deg); }
  }

  /* ⚡ 2. 文字色がギラギラと虹色に変化（文字版ゲーミング） */
  .text-rainbow {
    background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-size: 400% auto;
    animation: textRainbowAnim 3s linear infinite;
    font-weight: bold;
  }
  @keyframes textRainbowAnim {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
  }

  /* 🎯 3. マウスを乗せると文字が「びよーーん」と巨大化する */
  .simple-news-item:hover .text-big {
    display: inline-block;
    transform: scale(1.15); /* 1.15倍の大きさになります */
    color: #e74c3c;
    transition: transform 0.2s ease;
  }
  .text-big {
    transition: transform 0.2s ease;
  }

  /* 😶‍🌫️ 4. 文字がモザイク・砂嵐のようにボヤける（ホラー・バグ風） */
  .text-glitch {
    color: #333;
    animation: glitchBlur 2s steps(2) infinite;
  }
  @keyframes glitchBlur {
    0%, 100% { filter: blur(0px); }
    50% { filter: blur(2px); color: #ff0055; text-shadow: 2px 2px #00ffff; }
  }

  /* タイトルのスタイル（長すぎる文字を自動で「...」にする） */
  .simple-news-title {
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-grow: 1;
    text-align: left;
  }

  /* スマホ対応 */
  @media (max-width: 500px) {
    .simple-news-item { gap: 10px; font-size: 0.8rem; }
    .simple-news-label { padding: 2px 6px; }
  }
</style>

<div class="simple-news-box">
  
  <div class="simple-news-scroll">
    <a href="" class="simple-news-item">
      <time class="simple-news-date">2026.10.20</time>
      <span class="simple-news-label green">更新</span>
      <p class="simple-news-title">ホームページ作った！</p>
    </a>

  </div>
</div>
